[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stockai"
version = "0.1.0"
description = "Lernende KI zur Aktien- und News-Analyse mit Empfehlungs- und Portfolio-Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "vaderSentiment>=3.3",
    "pyyaml>=6.0",
    "streamlit>=1.30",
    "plotly>=5.18",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stockai = "stockai.cli:main"

[tool.setuptools]
packages = ["stockai", "stockai.data", "stockai.features", "stockai.model"]
