[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron"
version = "0.1.0"
description = "NFL-Scouting & Tendenz-Analyse für Coaches (lokal, CPU, freie Daten)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=0.10",
    "pyarrow>=14",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gridiron = "gridiron.cli:main"

[tool.setuptools]
packages = ["gridiron", "gridiron.sources"]
