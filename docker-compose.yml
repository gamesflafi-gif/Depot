services:
  stockai:
    build: .
    container_name: stockai
    restart: unless-stopped
    # Secrets aus der .env-Datei laden (Telegram-Token, Chat-ID, ggf. NewsAPI).
    env_file:
      - .env
    environment:
      STOCKAI_MONTHLY: "100"          # Sparbetrag €/Monat
      STOCKAI_INTERVAL_SECONDS: "86400"  # täglich
    # gelernte Daten/Modelle dauerhaft speichern
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
