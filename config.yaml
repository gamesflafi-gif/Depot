# Konfiguration der Aktien-KI
# ---------------------------------
# Datenquelle:
#   live  = echte Daten via yfinance + RSS-News
#           (benötigt Netzwerkzugriff auf finance.yahoo.com & news.google.com –
#            in gesperrten Umgebungen ggf. die Netzwerk-Allowlist anpassen)
#   demo  = synthetische Offline-Daten zum Ausprobieren der Lern-Logik
# Standard ist "demo", damit das Projekt überall sofort läuft.
data_source: demo

# Kursquelle im Live-Modus (anbieter-unabhängig, kein API-Key nötig):
#   auto     -> erst yfinance, dann direkter Stooq-CSV-Download (Fallback)
#   yfinance -> Yahoo Finance
#   stooq    -> direkter CSV-Download von stooq.com
price_source: auto

# Welche Aktien werden beobachtet und analysiert?
# Ein größeres Universum macht die Querschnitts-Features (relative Stärke)
# deutlich aussagekräftiger – je mehr Werte, desto besser das Ranking.
tickers:
  - AAPL   # Apple
  - MSFT   # Microsoft
  - NVDA   # Nvidia
  - GOOGL  # Alphabet
  - AMZN   # Amazon
  - TSLA   # Tesla
  - META   # Meta
  - AVGO   # Broadcom
  - AMD    # AMD
  - NFLX   # Netflix
  - CRM    # Salesforce
  - ORCL   # Oracle
  - ADBE   # Adobe
  - INTC   # Intel
  - QCOM   # Qualcomm
  - JPM    # JPMorgan
  - V      # Visa
  - MA     # Mastercard
  - JNJ    # Johnson & Johnson
  - WMT    # Walmart
  - XOM    # ExxonMobil
  - KO     # Coca-Cola
  - DIS    # Disney
  - BA     # Boeing

# Branchen-Zuordnung (für Sektor-Diversifikation im Portfolio/Sparplan).
# Nicht zugeordnete Ticker zählen als "Sonstige".
sectors:
  AAPL: Tech
  MSFT: Tech
  NVDA: Tech
  GOOGL: Tech
  AMZN: ConsumerDiscretionary
  TSLA: ConsumerDiscretionary
  META: Tech
  AVGO: Tech
  AMD: Tech
  NFLX: Communication
  CRM: Tech
  ORCL: Tech
  ADBE: Tech
  INTC: Tech
  QCOM: Tech
  JPM: Financials
  V: Financials
  MA: Financials
  JNJ: Healthcare
  WMT: ConsumerStaples
  XOM: Energy
  KO: ConsumerStaples
  DIS: Communication
  BA: Industrials

# ETFs/Fonds für den "Core" des Sparplans (breiter gestreut, geringeres Risiko).
# Im Demo-Modus sind das synthetische Platzhalter; für echte Daten z.B.:
#   VWCE.DE (FTSE All-World), EUNL.DE (MSCI World), SXR8.DE (S&P 500)
etfs:
  - WORLD   # breiter Welt-ETF (Demo-Platzhalter)
  - SP500   # US-Leitindex (Demo-Platzhalter)

# Wie viel Kurs-Historie wird für Training/Features geladen?
history_period: "2y"        # z.B. 1y, 2y, 5y, max
history_interval: "1d"      # 1d = Tageskerzen

# Vorhersage-Ziel
horizon_days: 5             # Über wie viele Handelstage wird die Rendite vorhergesagt?
profit_threshold: 0.0       # Ab welcher Rendite gilt es als "profitabel" (0.0 = jede positive Bewegung)

# News
news_max_per_ticker: 25     # Maximale Anzahl Headlines pro Ticker
news_lookback_days: 7       # Wie alt dürfen News für das Live-Sentiment sein?

# Modell / Lernen
model:
  # Modelltyp:
  #   auto                    -> wählt per Kreuzvalidierung automatisch das beste
  #   hist_gradient_boosting  -> schnelles, starkes Baummodell (Standard)
  #   gradient_boosting | random_forest | logistic | ensemble | sgd_online
  type: "auto"
  calibrate: true           # kalibrierte, verlässlichere P(Profit)-Wahrscheinlichkeiten
  test_size: 0.2            # Anteil der Daten für die finale Out-of-Sample-Bewertung
  random_state: 42

# Pfade (relativ zum Projekt-Root)
paths:
  store_dir: "data/store"     # Feature-Store (gesammelte Lerndaten)
  model_dir: "data/models"    # Gespeicherte Modelle + Lernhistorie
